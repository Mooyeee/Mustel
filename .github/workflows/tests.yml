name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: swift test

  intellij:
    name: IntelliJ bridge
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run IntelliJ bridge tests
        working-directory: intellij-plugin
        run: ./gradlew test --no-daemon
